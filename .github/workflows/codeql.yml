name: 'CodeQL Advanced'

on:
  push:
    branches: ['develop']
  pull_request:
    branches: ['develop']
  schedule:
    - cron: '35 0 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: 'javascript-typescript'
            # Switch to manual to ensure it sees your TS compilation
            build-mode: 'manual'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # This config blocks CodeQL from scanning minified/dist files
          config: |
            paths-ignore:
              - '**/node_modules/**'
              - '**/dist/**'
              - '**/*.min.js'
              - 'scripts/scripts.js' # Ignore the intermediate JS from TSC

      - name: Install and Build
        # This replaces the 'exit 1' manual step with your actual Golden script
        run: |
          npm ci
          npm run build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{matrix.language}}'
